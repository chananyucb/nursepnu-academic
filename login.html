<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เข้าสู่ระบบ · คณะพยาบาลศาสตร์ มนร.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Kanit:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'IBM Plex Sans Thai', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #1d4ed8 100%);
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    /* decorative bg circles */
    body::before {
      content: '';
      position: fixed;
      top: -120px; right: -120px;
      width: 480px; height: 480px;
      border-radius: 50%;
      background: rgba(96,165,250,.08);
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -100px; left: -100px;
      width: 360px; height: 360px;
      border-radius: 50%;
      background: rgba(255,255,255,.04);
      pointer-events: none;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 24px 64px rgba(0,0,0,.22), 0 4px 16px rgba(0,0,0,.12);
      overflow: hidden;
      position: relative;
      z-index: 1;
    }

    .card-top {
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      padding: 36px 36px 32px;
      text-align: center;
    }
    .logo-icon {
      width: 64px; height: 64px;
      border-radius: 18px;
      background: rgba(255,255,255,.15);
      border: 2px solid rgba(255,255,255,.25);
      display: flex; align-items: center; justify-content: center;
      font-size: 30px;
      margin: 0 auto 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,.15);
    }
    .card-top h1 {
      font-family: 'Kanit', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }
    .card-top p {
      font-size: 13px;
      color: rgba(255,255,255,.7);
      line-height: 1.5;
    }

    .card-body {
      padding: 32px 36px 36px;
    }

    .field { margin-bottom: 18px; }
    .field label {
      display: block;
      font-size: 13.5px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 7px;
    }
    .field label span { color: #d14 }

    .input-wrap {
      position: relative;
    }
    .input-icon {
      position: absolute;
      left: 13px; top: 50%;
      transform: translateY(-50%);
      color: #9ca3af;
      pointer-events: none;
    }
    .input {
      width: 100%;
      padding: 11px 14px 11px 40px;
      border: 1.5px solid #e5e7eb;
      border-radius: 12px;
      font-family: 'IBM Plex Sans Thai', sans-serif;
      font-size: 14.5px;
      color: #111827;
      background: #f9fafb;
      outline: none;
      transition: border-color .18s, box-shadow .18s, background .18s;
    }
    .input:focus {
      border-color: #2563eb;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(37,99,235,.12);
    }

    .error-box {
      display: none;
      background: #fef2f2;
      border: 1px solid #fca5a5;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 13.5px;
      color: #b91c1c;
      margin-bottom: 18px;
      align-items: center;
      gap: 8px;
    }
    .error-box.show { display: flex; }

    .btn-login {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      font-family: 'IBM Plex Sans Thai', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(37,99,235,.35);
      transition: opacity .18s, transform .1s;
      letter-spacing: .02em;
    }
    .btn-login:hover   { opacity: .92; }
    .btn-login:active  { transform: scale(.98); }
    .btn-login:disabled { opacity: .6; cursor: not-allowed; }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 13.5px;
      color: #6b7280;
      text-decoration: none;
    }
    .back-link span { color: #2563eb; font-weight: 600; }
    .back-link:hover span { text-decoration: underline; }

    .hint {
      text-align: center;
      font-size: 12px;
      color: #9ca3af;
      margin-top: 14px;
      line-height: 1.5;
    }

    /* shake animation for error */
    @keyframes shake {
      0%,100%{transform:translateX(0)}
      20%{transform:translateX(-6px)}
      40%{transform:translateX(6px)}
      60%{transform:translateX(-4px)}
      80%{transform:translateX(4px)}
    }
    .shake { animation: shake .35s ease; }

    /* floating particles */
    .particles { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
    .particle {
      position: absolute;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,.15);
      animation: float linear infinite;
    }
    @keyframes float {
      0%   { transform: translateY(110vh) scale(0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: .5; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- floating particles -->
  <div class="particles" id="particles"></div>

  <div class="card" id="card">
    <div class="card-top">
      <div class="logo-icon">🏥</div>
      <h1>เข้าสู่ระบบผู้ดูแล</h1>
      <p>ระบบบริการวิชาการ คณะพยาบาลศาสตร์<br/>มหาวิทยาลัยนราธิวาสราชนครินทร์</p>
    </div>

    <div class="card-body">
      <div class="error-box" id="errBox">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="errMsg">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</span>
      </div>

      <form id="loginForm" onsubmit="return false;">
        <div class="field">
          <label>ชื่อผู้ใช้ <span>*</span></label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input class="input" id="username" type="text" placeholder="กรอกชื่อผู้ใช้" autocomplete="username" />
          </div>
        </div>

        <div class="field">
          <label>รหัสผ่าน <span>*</span></label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            <input class="input" id="password" type="password" placeholder="กรอกรหัสผ่าน" autocomplete="current-password" />
          </div>
        </div>

        <button class="btn-login" id="loginBtn" type="button" onclick="doLogin()">เข้าสู่ระบบ</button>
      </form>

      <a href="public.html" class="back-link">← กลับ<span>หน้าสาธารณะ</span></a>
      <div class="hint">สำหรับผู้ดูแลระบบและเจ้าหน้าที่ที่ได้รับสิทธิ์เท่านั้น</div>
    </div>
  </div>

  <script>
    /* ── credentials (change as needed) ── */
    const USERS = {
      'admin':   'nursepnu2024',
      'nursepnu':'nurse@2024',
    };

    function doLogin() {
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      const errBox = document.getElementById('errBox');
      const errMsg = document.getElementById('errMsg');

      if (!u || !p) {
        errMsg.textContent = 'กรุณากรอกชื่อผู้ใช้และรหัสผ่าน';
        errBox.classList.add('show');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'กำลังตรวจสอบ…';

      setTimeout(() => {
        if (USERS[u] && USERS[u] === p) {
          /* success */
          sessionStorage.setItem('nursepnu_auth', '1');
          sessionStorage.setItem('nursepnu_user', u);
          btn.textContent = '✓ เข้าสู่ระบบสำเร็จ กำลังเปลี่ยนหน้า…';
          btn.style.background = 'linear-gradient(135deg,#15803d,#166534)';
          errBox.classList.remove('show');
          setTimeout(() => { window.location.replace('admin.html'); }, 600);
        } else {
          /* fail */
          errMsg.textContent = 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';
          errBox.classList.add('show');
          btn.disabled = false;
          btn.textContent = 'เข้าสู่ระบบ';
          document.getElementById('card').classList.add('shake');
          setTimeout(() => document.getElementById('card').classList.remove('shake'), 400);
          document.getElementById('password').value = '';
          document.getElementById('password').focus();
        }
      }, 500);
    }

    /* Enter key submits */
    document.addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });

    /* generate particles */
    const pc = document.getElementById('particles');
    for (let i = 0; i < 18; i++) {
      const d = document.createElement('div');
      d.className = 'particle';
      d.style.left = Math.random() * 100 + 'vw';
      d.style.width = d.style.height = (4 + Math.random() * 8) + 'px';
      d.style.animationDuration = (8 + Math.random() * 14) + 's';
      d.style.animationDelay    = -(Math.random() * 20) + 's';
      pc.appendChild(d);
    }

    /* if already logged in, go straight to admin */
    if (sessionStorage.getItem('nursepnu_auth') === '1') {
      window.location.replace('admin.html');
    }
  </script>
</body>
</html>
